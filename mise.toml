# Pinned tools. `mise install` installs exactly these versions; mise.lock records their checksums.
# Bump a tool by editing its version here, then `mise lock` and `moon run :check`.
min_version = "2026.11.2"

[settings]
lockfile = true
experimental = true

[tools]
"aqua:moonrepo/moon" = "2.6.5" # task runner: `moon run :check` is the gate
"github:lune-org/lune" = "0.11.1" # runs the build, tests and scripts (keep .luaurc's typedefs alias in step)
"github:JohnnyMorganz/luau-lsp" = "1.70.1" # type-checks everything on the new solver
"aqua:JohnnyMorganz/StyLua" = "2.6.0"
"aqua:Kampfkarren/selene" = "0.32.0"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0" # GitHub Actions security lint
"aqua:dprint/dprint" = "0.64.3" # Markdown, JSON, YAML and TOML formatting
"aqua:lycheeverse/lychee" = "0.24.2" # offline link check of the docs
"github:seaofvoices/darklua" = "0.19.0" # bundles src/ into dist/ForeverMyth.lua (Luau -> Lua 5.1)
"aqua:evilmartians/lefthook" = "2.2.2" # git hooks
"bun" = "1.4.4" # docs site package manager, script and test runner (docs/)
"node" = "26.13.1" # runs Astro for the docs site (active LTS)
"github:luau-lang/luau" = "0.747" # luau-ast, which starlight-luau reads the API reference from (docs/)
"conda:luajit" = "2.1.1744318430" # Lua 5.1 semantics, as in WoW: runs the bundle in tests/lua51
