# Pinned tools. `mise install` installs exactly these versions; mise.lock records their checksums.
# Bump a tool by editing its version here, then `mise lock` and `sgt check`.
min_version = "2026.11.2"

[settings]
lockfile = true
experimental = true

[tools]
"github:lune-org/lune" = "0.11.1" # runs the generator, build, and scripts (keep .luaurc's typedefs alias in step)
"github:JohnnyMorganz/luau-lsp" = "1.70.1" # type-checks everything on the new solver
"aqua:JohnnyMorganz/StyLua" = "2.6.0"
"aqua:Kampfkarren/selene" = "0.32.0"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0" # GitHub Actions security lint
"aqua:lycheeverse/lychee" = "0.24.2" # offline link check of Markdown files
"github:seaofvoices/darklua" = "0.19.0" # bundles src/ into dist/ForeverMyth.lua and lowers LuaJIT test closures
"aqua:evilmartians/lefthook" = "2.2.2" # git hooks
"bun" = "1.4.4" # docs site package manager, script and test runner (docs/)
"node" = "26.13.1" # runs Astro for the docs site (active LTS)
"github:luau-lang/luau" = "0.747" # luau-ast, which starlight-luau reads the API reference from (docs/)

[tools."http:sgt"]
version = "0.14.3"
bin_path = "."

[tools."http:sgt".platforms]
linux-x64 = { url = "https://github.com/Braden1996/sergeant-releases/releases/download/v{{version}}/sgt-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { url = "https://github.com/Braden1996/sergeant-releases/releases/download/v{{version}}/sgt-aarch64-unknown-linux-musl.tar.gz" }
windows-x64 = { url = "https://github.com/Braden1996/sergeant-releases/releases/download/v{{version}}/sgt-x86_64-pc-windows-msvc.tar.gz" }

[tools."http:woof"]
version = "0.1.0"
bin_path = "."

[tools."http:woof".platforms]
linux-x64 = { url = "https://github.com/Braden1996/woof/releases/download/v{{version}}/woof-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { url = "https://github.com/Braden1996/woof/releases/download/v{{version}}/woof-aarch64-unknown-linux-musl.tar.gz" }
macos-arm64 = { url = "https://github.com/Braden1996/woof/releases/download/v{{version}}/woof-aarch64-apple-darwin.tar.gz" }
macos-x64 = { url = "https://github.com/Braden1996/woof/releases/download/v{{version}}/woof-x86_64-apple-darwin.tar.gz" }
windows-x64 = { url = "https://github.com/Braden1996/woof/releases/download/v{{version}}/woof-x86_64-pc-windows-msvc.tar.gz" }
