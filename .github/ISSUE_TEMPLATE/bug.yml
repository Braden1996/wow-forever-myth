name: Bug or wrong shape
description: A wrapper behaves differently from the API it wraps, or its types are wrong.
labels: [bug]
body:
  - type: input
    id: api
    attributes:
      label: The API (as in api-shapes.json)
      placeholder: C_Item.GetItemInfo, or Region:GetPoint
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Smallest code that shows it
      description: "A --!strict snippet, and whether it runs in WoW (dist/ForeverMyth.lua) or is a type error."
      render: luau
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens (luau-lsp output, runtime error or in-game value)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wow-forever-myth version and game build
      placeholder: v0.1.0, 1.60.1
