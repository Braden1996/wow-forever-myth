name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
        with:
          seal-sysctl: "true"
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
        with:
          luau-ast: "true"
      - uses: ./.github/actions/setup-workspace
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
      - name: Verify the release archive and checksums
        run: woof pack --extra-artifact dist/ForeverMyth.lua --sha256sums SHA256SUMS

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
      - uses: Braden1996/sergeant-releases/actions/release-woof@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
        with:
          extra-artifacts: dist/ForeverMyth.lua
