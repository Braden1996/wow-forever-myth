# Builds the documentation site (docs/) and deploys it to GitHub Pages from main. Fully static: the API reference is
# generated from src/ and the examples are checked against the releases deps.toml pins. The ci workflow runs the same
# build, plus every check, on pull requests. No dependency cache here: the published site is built from a clean
# install (zizmor cache-poisoning).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "overrides/**"
      - "deps.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun node github:lune-org/lune github:luau-lang/luau
          cache: false
      - name: fetch the pinned releases
        run: mise exec -- lune run scripts/fetch
      - name: install
        working-directory: docs
        run: mise exec -- bun install --frozen-lockfile
      - name: build
        working-directory: docs
        run: mise exec -- bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
