name: pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
        with:
          seal-sysctl: "true"
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
        with:
          luau-ast: "true"
      - uses: ./.github/actions/setup-workspace
      - run: sgt --no-daemon install --frozen
      - uses: Braden1996/sergeant-releases/actions/deploy-astro-pages@v0.15.0 # zizmor: ignore[unpinned-uses] -- Sergeant 0.15.0 release action
        with:
          unit: "@wow-forever-myth/docs"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
