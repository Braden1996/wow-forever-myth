$schema: "../.moon/cache/schemas/project.json"

# Project `generator`: fetches the pinned releases (deps.toml) and generates src/Api and src/Widgets from
# api-shapes.json and the reviewed overrides/.
layer: "tool"
tags: ["luau"]

taskOptions:
  shell: false
  runFromWorkspaceRoot: true

tasks:
  lune-types:
    description: "Write Lune's type definitions, which .luaurc's `@lune` alias points at"
    command: "lune"
    args: ["setup"]
    options:
      cache: false
  fetch:
    description: "Download the releases deps.toml pins into .deps/ and verify every SHA-256"
    command: "lune"
    args: ["run", "scripts/fetch"]
    options:
      cache: false
  generate:
    description: "Regenerate src/Api and src/Widgets from api-shapes.json and overrides/"
    command: "lune"
    args: ["run", "scripts/generate"]
    deps: ["~:fetch"]
    options:
      cache: false
  fresh:
    description: "The overrides agree with api-shapes.json and src/Api, src/Widgets equal a fresh generation"
    command: "lune"
    args: ["run", "scripts/generate", "--", "--check"]
    deps: ["~:fetch"]
    options:
      cache: false
  check:
    description: "Aggregator: every generator check"
    deps: ["~:fresh"]
